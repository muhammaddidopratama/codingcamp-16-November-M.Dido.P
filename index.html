<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">
      🌙 Toggle Theme
    </button>

    <!-- Greeting Widget -->
    <section id="greeting-widget" aria-label="Greeting">
      <p id="greeting-time"></p>
      <p id="greeting-date"></p>
      <p id="greeting-message"></p>
    </section>

    <!-- Custom Name Widget -->
    <section id="name-widget" aria-label="Custom Name">
      <form id="name-form" novalidate>
        <label for="name-input">Your name</label>
        <input type="text" id="name-input" maxlength="50" autocomplete="off" />
        <button type="submit">Save name</button>
        <span id="name-error" role="alert" aria-live="polite"></span>
      </form>
    </section>

    <!-- Pomodoro Timer Widget -->
    <section id="timer-widget" aria-label="Pomodoro Timer">
      <div id="timer-display">25:00</div>
      <div id="timer-alert" hidden>⏰ Time is up!</div>
      <div>
        <button type="button" id="timer-start">Start</button>
        <button type="button" id="timer-stop">Stop</button>
        <button type="button" id="timer-reset">Reset</button>
      </div>
      <form id="timer-duration-form" novalidate>
        <label for="timer-duration-input">Duration (minutes)</label>
        <input type="number" id="timer-duration-input" min="1" max="60" />
        <button type="submit">Save duration</button>
        <span id="timer-duration-error" role="alert" aria-live="polite"></span>
      </form>
    </section>

    <!-- To-Do List Widget -->
    <section id="todo-widget" aria-label="To-Do List">
      <form id="todo-add-form" novalidate>
        <label for="todo-input">New task</label>
        <input type="text" id="todo-input" maxlength="500" autocomplete="off" />
        <button type="submit">Add task</button>
        <span id="todo-error" role="alert" aria-live="polite"></span>
      </form>
      <ul id="todo-list"></ul>
    </section>

    <!-- Quick Links Widget -->
    <section id="links-widget" aria-label="Quick Links">
      <form id="links-add-form" novalidate>
        <label for="links-label-input">Label</label>
        <input type="text" id="links-label-input" maxlength="100" autocomplete="off" />
        <span id="links-label-error" role="alert" aria-live="polite"></span>
        <label for="links-url-input">URL</label>
        <input type="url" id="links-url-input" maxlength="2048" autocomplete="off" />
        <span id="links-url-error" role="alert" aria-live="polite"></span>
        <button type="submit">Add link</button>
        <span id="links-cap-error" role="alert" aria-live="polite"></span>
      </form>
      <div id="links-list"></div>
    </section>

    <script src="js/app.js" defer></script>
  </body>
</html>
